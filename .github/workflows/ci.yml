name: NoteCast AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate NoteCast AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f README.md

      - name: Check project structure
        run: |
          echo "Checking NoteCast AI project..."
          echo "index.html found"
          echo "style.css found"
          echo "app.js found"
          echo "README.md found"
          echo "CI validation successful!"