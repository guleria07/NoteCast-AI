name: NoteCast AI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate NoteCast AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f README.md

      - name: Check project structure
        run: |
          echo "Checking NoteCast AI project..."
          echo "index.html found"
          echo "style.css found"
          echo "app.js found"
          echo "README.md found"
          echo "CI validation successful!"

  deploy:
    name: Deploy Frontend to AWS S3
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::696223520662:role/NoteCastFrontendDeployPolicy
          aws-region: ap-south-1

      - name: Deploy frontend to S3
        run: |
          aws s3 sync . s3://notecast-ai-frontend-2026 \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"